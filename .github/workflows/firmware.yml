name: Build Kenzo UEFI Firmware

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: uefi-kenzo-${{ github.ref }}
  cancel-in-progress: true

jobs:
  firmware:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Install EDK II and Boot Image tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential uuid-dev clang lld llvm python3 nasm \
            acpica-tools device-tree-compiler git ca-certificates

      - name: Check out uefi-kenzo
        uses: actions/checkout@v4
        with:
          path: uefi-kenzo

      - name: Check out UniXNU
        uses: actions/checkout@v4
        with:
          repository: UniXNU/UniXNU
          ref: c34f018aafd6befd5dc93c05a8dccd5bdce6724b
          path: UniXNU

      - name: Initialize DarwinBoot submodule in UniXNU
        working-directory: UniXNU
        run: git submodule update --init --depth 1 drivers/DarwinBoot

      - name: Check out UniXNU-kenzo
        uses: actions/checkout@v4
        with:
          repository: CodeDevB7/UniXNU-kenzo
          ref: main
          path: device

      - name: Build SILICIUM_UEFI.fd and kenzo-uefi-only-boot.img
        working-directory: UniXNU
        run: |
          set -euo pipefail
          ./unixnu defconfig kenzo_defconfig -D ../device
          ./unixnu build firmware -D ../device --uefi ../uefi-kenzo --target DEBUG -j "$(nproc)"
          # Build BootShim (text_offset=0x80000, image_size=0 for stock Kenzo LK aboot) and pack boot.img
          TOOLCHAIN="$(pwd)/out/kenzo/ipados-17.7.11-21H461/kenzo/toolchain"
          "$TOOLCHAIN/clang" -target aarch64-none-elf -c -x assembler-with-cpp \
            -DREQUIRES_KERNEL_HEADER=1 -DFD_BASE=0x9FC00000 -DFD_SIZE=0x00300000 \
            -o ../BootShim.o ../uefi-kenzo/BootShim/BootShim.S
          "$TOOLCHAIN/ld.lld" -Ttext=0x80080000 --oformat=binary -o ../BootShim.bin ../BootShim.o
          cat ../BootShim.bin ../uefi-kenzo/Build/kenzoPkg/DEBUG_CLANGPDB/FV/SILICIUM_UEFI.fd | gzip -9 > ../Image.gz
          cat ../Image.gz ../uefi-kenzo/Resources/DTBs/kenzo.dtb > ../Image.gz-dtb
          printf '\x00\x00\x00\x00' > ../dummy-ramdisk.bin
          python3 ../uefi-kenzo/Resources/Scripts/mkbootimg.py \
            --kernel ../Image.gz-dtb \
            --ramdisk ../dummy-ramdisk.bin \
            --base 0x80000000 \
            --kernel_offset 0x00008000 \
            --ramdisk_offset 0x01000000 \
            --tags_offset 0x00000100 \
            --pagesize 2048 \
            --header_version 0 \
            --cmdline "console=ttyHSL0,115200,n8" \
            -o ../kenzo-uefi-only-boot.img
          echo "=== Output Checksums ==="
          ls -lh ../uefi-kenzo/Build/kenzoPkg/DEBUG_CLANGPDB/FV/SILICIUM_UEFI.fd ../kenzo-uefi-only-boot.img
          sha256sum ../uefi-kenzo/Build/kenzoPkg/DEBUG_CLANGPDB/FV/SILICIUM_UEFI.fd ../kenzo-uefi-only-boot.img

      - name: Upload firmware build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kenzo-uefi-build-logs
          path: |
            UniXNU/out/kenzo/ipados-17.7.11-21H461/kenzo/logs/*.log
          if-no-files-found: ignore

      - name: Upload SILICIUM_UEFI.fd and boot image
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: kenzo-uefi-firmware-debug
          path: |
            uefi-kenzo/Build/kenzoPkg/DEBUG_CLANGPDB/FV/SILICIUM_UEFI.fd
            kenzo-uefi-only-boot.img
          if-no-files-found: error
